name: Weekly traffic snapshot
on:
  schedule:
    - cron: "17 9 * * 0"   # Sundays 09:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_traffic.py
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      - run: |
          git config user.name "traffic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/traffic.json || true
          git diff --cached --quiet || (git commit -m "Weekly traffic snapshot" && git pull --rebase && git push)
