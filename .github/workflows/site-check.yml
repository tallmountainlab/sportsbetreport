name: Site check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch key URLs the way Google does
        run: |
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for u in https://sportsbetreport.com/ https://sportsbetreport.com/robots.txt https://sportsbetreport.com/sitemap.xml https://www.sportsbetreport.com/sitemap.xml; do
            echo "=== $u"
            curl -sS -A "$UA" -D - -o body.txt -L --max-redirs 3 "$u" | grep -iE "^(HTTP|content-type|location|cf-mitigated|server)" || true
            head -c 600 body.txt; echo
          done
      - name: Check YouTube feeds
        run: |
          for q in "channel_id=UCDVYQ4Zhbm3S2dlz7P1GBDg" "channel_id=UCBR8-60-B28hp2BmDPdntcQ" "playlist_id=UUDVYQ4Zhbm3S2dlz7P1GBDg"; do
            echo "=== $q"; curl -sS -o f.xml -w "%{http_code}\n" "https://www.youtube.com/feeds/videos.xml?$q"; head -c 300 f.xml; echo
          done
          echo "=== youtube.com/@NFL"; curl -sS -o /dev/null -w "%{http_code}\n" https://www.youtube.com/@NFL
