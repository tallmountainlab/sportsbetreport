name: Daily odds report

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC = 7 AM ET (8 AM during daylight time)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch lines and write today's report
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 fetch_odds.py
      - name: Collect league highlight videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/fetch_highlights.py
      - name: Build the site
        run: python3 build.py
      - name: Publish
        run: |
          git config user.name "sportsbetreport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Daily report $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          fi
